<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ledesmita TV - Home</title>

    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'WC26';
            src: url('font/FWC2026-CondensedBlack.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'WC26-light';
            src: url('font/FWC2026-CondensedLight.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-border: #30363d;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --live-color: #ff0055;
            --offline-color: #8b949e;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('img/Poster-Ledesmita-TV-Fondo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 30px;
        }

        #video {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -5;
            visibility: visible;
            opacity: 1;
        }

        .app-header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.85) 0%, rgba(13, 17, 23, 0.4) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header img.logo {
            width: 30px;
            height: auto;
        }

        .app-header h1 {
            font-family: "Audiowide", sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-actions a {
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .header-actions a:active {
            transform: scale(0.85);
        }

        .header-actions img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .main-container {
            position: relative;
            z-index: 10;
            max-width: 650px;
            margin: 0 auto;
            padding: 15px;
        }

        /* --- BARRA DE SELECCIÓN DE REPRODUCTOR --- */
        .player-selector-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .player-toggle-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .player-toggle-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .player-toggle-btn.active {
            background: var(--accent-gradient);
            color: #000;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--card-border);
            margin-bottom: 5px;
        }

        .player-wrapper .video-js,
        .player-wrapper iframe,
        .player-wrapper div#main-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .stream-meta {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .stream-info-left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .stream-meta h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-main);
        }

        .stream-meta .stream-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0;
            display: block;
        }

        .stream-status-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .meta-badges {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-live {
            background-color: var(--live-color);
            color: white;
            animation: pulse 2s infinite;
        }

        .badge-offline {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .carousel-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .carousel-slides {
            display: flex;
            width: 100%;
            height: 80px;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
        }

        .slide a,
        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-dots {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background-color: var(--accent-color);
            transform: scale(1.2);
            width: 15px;
            border-radius: 4px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 25px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
            font-weight: 400;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .channel-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .channel-card:active {
            transform: scale(0.96);
        }

        .channel-card.active {
            border-color: var(--accent-color);
            background: linear-gradient(180deg, rgba(22, 27, 34, 0.95) 100%, rgba(0, 242, 254, 0.05) 100%);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .icon-box {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .icon-blue { background: rgba(0, 242, 254, 0.15); color: #00f2fe; }
        .icon-green { background: rgba(57, 211, 83, 0.15); color: #39d353; }
        .icon-purple { background: rgba(188, 114, 253, 0.15); color: #bc72fd; }
        .icon-orange { background: rgba(255, 165, 0, 0.15); color: #ffa500; }

        .card-info h3 {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contador-vivo-container {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
        }

        .numero-espectadores {
            color: #ffffff;
            font-weight: 600;
        }

        .punto-rojo-pulso {
            width: 7px;
            height: 7px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            animation: pulso_activos 1.5s infinite;
        }

        @keyframes pulso_activos {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        @media (max-width: 480px) {
            .app-header h1 { font-size: 1rem; }
            .header-actions img { width: 24px; height: 24px; }
            .carousel-slides { height: 68px; }
            .stream-meta h2 { font-size: 1rem; }
            .stream-meta .stream-subtitle { font-size: 0.78rem; }
        }

        @media (min-width: 768px) {
            .app-header { padding: 15px 40px; }
            .main-container { padding: 25px 0; }
            .carousel-slides { height: 100px; }
        }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLvm5K1NA_Py5cVIeX5bcuvxc7zgbwYq0",
            authDomain: "ledesmita-tv.firebaseapp.com",
            databaseURL: "https://ledesmita-tv-default-rtdb.firebaseio.com",
            projectId: "ledesmita-tv",
            storageBucket: "ledesmita-tv.firebasestorage.app",
            messagingSenderId: "15472268710",
            appId: "1:15472268710:web:a09ee6f84aa38c4e54eb67"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const referenciaContador = database.ref("usuarios_activos");
        const elementoContador = document.getElementById('usuarios_activos');

        referenciaContador.on('value', (snapshot) => {
            const cantidad = snapshot.val() || 0;
            const activosReales = cantidad <= 0 ? 1 : cantidad;
            elementoContador.innerText = `${activosReales} Espectadores`;
        });

        const conexionRef = database.ref(".info/connected");

        conexionRef.on("value", (snapshot) => {
            if (snapshot.val() === true) {
                const miSesionRef = database.ref("sesiones").push();
                miSesionRef.onDisconnect().remove();
                miSesionRef.set({
                    activo: true,
                    hora: firebase.database.ServerValue.TIMESTAMP
                });
            }
        });

        database.ref("sesiones").on("value", (sesionesSnapshot) => {
            const totalSesiones = sesionesSnapshot.numChildren();
            referenciaContador.set(totalSesiones);
        });
    </script>

    <script>
        var player = null;

        function cargarReproductorSeleccionado() {
            var wrapper = document.getElementById('playerControlWrapper');

            if (player && typeof player.dispose === 'function') {
                player.dispose();
                player = null;
            }

            var activos = listaReproductores.filter(function(r) { return r.activo === true; });
            var seleccion = (activos.length === 1) ? activos[0] : listaReproductores[0];

            if (seleccion.tipo === 'vjs') {
                wrapper.innerHTML = `<video id="main-player" class="video-js vjs-default-skin vjs-big-play-centered" poster="img/Poster-Ledesmita-TV.png" controls preload="auto">Tu dispositivo no soporta este formato de video.</video>`;
                player = videojs('main-player');
                player.src({ type: 'application/x-mpegURL', src: seleccion.url });
                player.play();
            } else if (seleccion.tipo === 'kick') {
                wrapper.innerHTML = `<iframe src="https://player.kick.com/${seleccion.url}" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>`;
            } else if (seleccion.tipo === 'youtube') {
                wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${seleccion.url}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else if (seleccion.tipo === 'embed') {
                wrapper.innerHTML = seleccion.url;
            } else {
                wrapper.innerHTML = `<iframe src="${seleccion.url}" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>`;
            }

            return seleccion;
        }

        /* --- FUNCIÓN PARA CAMBIAR DESDE LOS BOTONES --- */
        function cambiarTipoReproductor(tipo) {
            listaReproductores.forEach(function(r) {
                r.activo = (r.tipo === tipo);
            });

            var btnVjs = document.getElementById('btnVjsPlayer');
            var btnKick = document.getElementById('btnKickPlayer');

            if (tipo === 'vjs') {
                btnVjs.classList.add('active');
                btnKick.classList.remove('active');
            } else {
                btnKick.classList.add('active');
                btnVjs.classList.remove('active');
            }

            var fuenteElegida = cargarReproductorSeleccionado();
            actualizarIndicadorEstado(fuenteElegida);
        }

        function actualizarIndicadorEstado(fuenteElegida) {
            var indicator = document.getElementById('live-indicator');
            if (!indicator) return;

            if (fuenteElegida.tipo === 'vjs') {
                checkStreamStatus(fuenteElegida.url, function (isOnline) {
                    if (isOnline) {
                        indicator.innerText = "● EN VIVO";
                        indicator.className = "badge badge-live";
                    } else {
                        indicator.innerText = "● SIN SEÑAL";
                        indicator.className = "badge badge-offline";
                    }
                });
            } else {
                indicator.innerText = "● EN VIVO";
                indicator.className = "badge badge-live";
            }
        }

        function checkStreamStatus(url, callback) {
            fetch(url, { method: 'HEAD', mode: 'cors' })
                .then(function (response) {
                    if (response.ok) { callback(true); } else { callback(false); }
                })
                .catch(function () {
                    callback(false);
                });
        }

        document.querySelectorAll('.channel-card').forEach(function (card) {
            card.addEventListener('click', function (e) {
                var appUrl = this.getAttribute('data-app-url');

                document.querySelectorAll('.channel-card').forEach(function (c) {
                    c.classList.remove('active');
                });
                this.classList.add('active');

                if (appUrl) {
                    if (!appUrl.startsWith('go:') && !appUrl.startsWith('http')) {
                        if (player && player.src) {
                            player.src({ type: 'application/x-mpegURL', src: appUrl });
                            player.play();
                        }
                    } else {
                        window.location.href = appUrl;
                    }
                }
            });
        });

        var slideIndex = 0;
        var slidesContainer = document.getElementById('carouselSlides');
        var dots = document.getElementsByClassName('dot');
        var totalSlides = dots.length;
        var timer;

        function showSlides() {
            slideIndex++;
            if (slideIndex >= totalSlides) { slideIndex = 0; }
            updateSliderPosition();
            timer = setTimeout(showSlides, 3000);
        }

        function currentSlide(index) {
            clearTimeout(timer);
            slideIndex = index;
            updateSliderPosition();
            timer = setTimeout(showSlides, 3000);
        }

        function updateSliderPosition() {
            if (slidesContainer) {
                slidesContainer.style.transform = 'translateX(' + (-slideIndex * 100) + '%)';
                for (var i = 0; i < dots.length; i++) { dots[i].classList.remove('active'); }
                dots[slideIndex].classList.add('active');
            }
        }

        window.onload = function () {
            showSlides();
            var fuenteElegida = cargarReproductorSeleccionado();
            actualizarIndicadorEstado(fuenteElegida);
        };
    </script>
</body>

</html>
